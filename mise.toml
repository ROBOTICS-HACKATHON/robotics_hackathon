[tasks.dev]
dir = "captcha"
run = "bun run dev"

[tasks.build]
dir = "captcha"
run = "bun run build"

[tasks.preview]
dir = "captcha"
run = "bun run preview"

[tasks."cad:build"]
run = "openscad -o cad/print/stylus_mount.stl cad/stylus_mount.scad"

[tasks."camera:compare"]
env = { PYTHONDONTWRITEBYTECODE = "1" }
run = "camera_experiment/.venv/bin/python -m camera_experiment.run"

[tasks."camera:report"]
env = { PYTHONDONTWRITEBYTECODE = "1" }
run = "camera_experiment/.venv/bin/python -m camera_experiment.compare"

[tasks."camera:all"]
description = "Solve all photos, compare degraded variants, and open the visual report"
run = "bash camera_experiment/all.sh"
