[project]
name = "captchasolver"
version = "0.1.0"
description = "Solve test captchas (text + click-the-tiles) with Cloudflare Workers AI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "pillow>=10", "playwright>=1.45", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[project.scripts]
captchasolver = "captchasolver.cli:main"
captchasolver-web = "captchasolver.web:main"
captchasolver-probe = "captchasolver.probe:main"
captchasolver-test = "captchasolver.bench:main"
captchasolver-compare = "captchasolver.compare:main"
captchasolver-replay = "captchasolver.bench:replay_main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
