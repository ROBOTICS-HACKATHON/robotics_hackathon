<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Screen calibration</title>
<style>
  html,body{margin:0;height:100%;background:#fff;font-family:system-ui,sans-serif;overflow:hidden;
            touch-action:none;user-select:none;-webkit-user-select:none}
  /* frame = rectangle between the markers' outer corners (INSET in markers.js) */
  #frame{position:fixed;inset:18px}
  .dot{position:absolute;width:16vmin;height:16vmin;transform:translate(-50%,-50%);border-radius:50%;
       background:radial-gradient(circle,#fff 0 18%,#ffd7d7 19% 38%,#fff 39% 58%,#ffd7d7 59% 100%);
       border:3px solid #e33;box-sizing:border-box;opacity:.35;transition:opacity .2s}
  .dot::before,.dot::after{content:"";position:absolute;background:#e33}
  .dot::before{left:50%;top:0;bottom:0;width:2px;transform:translateX(-50%)}
  .dot::after{top:50%;left:0;right:0;height:2px;transform:translateY(-50%)}
  .dot span{position:absolute;left:50%;bottom:100%;transform:translateX(-50%);margin-bottom:2px;
            font:700 3.5vmin system-ui;color:#e33}
  .dot.current{opacity:1;border-width:5px;box-shadow:0 0 0 6px #ffe3a3}
  .dot.hit{opacity:1;border-color:#1a9a4a}
  .dot.hit span{color:#1a9a4a}
  .offline .dot{opacity:1}
  .mark{position:absolute;width:22px;height:22px;transform:translate(-50%,-50%);pointer-events:none}
  .mark::before,.mark::after{content:"";position:absolute;background:#06c}
  .mark::before{left:10px;top:0;width:3px;height:22px}
  .mark::after{top:10px;left:0;width:22px;height:3px}
  #msg{position:fixed;left:50%;top:33%;transform:translate(-50%,-50%);text-align:center;color:#444;
       font-size:2.6vmin;pointer-events:none;max-width:70vmin}
  .aim{position:absolute;width:6vmin;height:6vmin;transform:translate(-50%,-50%);border:4px solid #f90;
       border-radius:50%;pointer-events:none;display:none}
  .testmode .dot{opacity:.25}
  .hitdot{position:absolute;width:10px;height:10px;transform:translate(-50%,-50%);border-radius:50%;
          background:#06c;opacity:.7;pointer-events:none}
  #last{display:block;margin-top:1vmin;font:700 5vmin ui-monospace,monospace;color:#06c}
</style></head>
<body>
<div id="frame"></div>
<div id="msg"><span id="status">Full-screen (F11). Touch the targets in order.</span>
  <span id="last"></span></div>
<script src="markers.js"></script>
<script>
  const live = location.protocol.startsWith("http");   // served by ./lr touch-calib
  if (!live) document.body.classList.add("offline");
  const n = Number(new URLSearchParams(location.search).get("grid") || 3);
  const f = document.getElementById("frame");
  const fr = [...Array(n)].map((_, i) => 0.15 + 0.7 * i / (n - 1));
  const dots = [];
  for (const v of fr) for (const u of fr) {
    const d = document.createElement("div");
    d.className = "dot"; d.style.left = u * 100 + "%"; d.style.top = v * 100 + "%";
    d.innerHTML = `<span>${dots.length + 1}</span>`;
    f.appendChild(d); dots.push(d);
  }
  const status = t => document.getElementById("status").textContent = t;
  let step = 0, mark, holdMsgUntil = 0, mode = "calib";
  const aim = document.createElement("div"); aim.className = "aim"; f.appendChild(aim);

  async function poll() {
    try {
      const s = await (await fetch("/state", {cache: "no-store"})).json();
      step = s.step; mode = s.mode || "calib";
      document.body.classList.toggle("testmode", mode === "test");
      if (s.target) { aim.style.display = "block"; aim.style.left = s.target[0] * 100 + "%"; aim.style.top = s.target[1] * 100 + "%"; }
      else aim.style.display = "none";
      dots.forEach((d, i) => {
        d.classList.toggle("current", mode === "calib" && i + 1 === step);
        d.classList.toggle("hit", mode === "calib" && i + 1 < step);
      });
      if (Date.now() > holdMsgUntil) status(s.msg);
    } catch { status("Waiting for the robot... (is ./lr touch-calib running?)"); }
    setTimeout(poll, 300);
  }
  if (live) poll();

  addEventListener("pointerdown", e => {
    e.preventDefault();
    const r = f.getBoundingClientRect();
    const u = (e.clientX - r.left) / r.width, v = (e.clientY - r.top) / r.height;
    document.getElementById("last").textContent = `${u.toFixed(3)} ${v.toFixed(3)}`;
    if (!mark) { mark = document.createElement("div"); mark.className = "mark"; f.appendChild(mark); }
    mark.style.left = u * 100 + "%"; mark.style.top = v * 100 + "%";
    const t = e.target.closest(".dot");
    if (!live) { if (t) t.classList.add("hit"); return; }
    const report = () => fetch("/touch", {method: "POST", headers: {"Content-Type": "application/json"},
                                  body: JSON.stringify({u, v, w: r.width, h: r.height})});
    if (mode === "test") {   // tap test: report every touch, leave a dot where it landed
      const hd = document.createElement("div"); hd.className = "hitdot";
      hd.style.left = u * 100 + "%"; hd.style.top = v * 100 + "%"; f.appendChild(hd);
      return report();
    }
    // Only report touches inside the current target, so a slip on the way there is ignored
    if (t && dots.indexOf(t) + 1 === step) {
      report();
    } else if (step >= 1 && step <= dots.length) {
      status(`Missed: touch inside target ${step}`); holdMsgUntil = Date.now() + 2000;
    }
  });
</script>
</body></html>
